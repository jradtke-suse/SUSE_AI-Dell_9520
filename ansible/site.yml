---
- name: SUSE AI on a single SLES 16 + NVIDIA node
  hosts: all
  pre_tasks:
    # Secrets, see group_vars/all/main.yml. Tagged `always` so every --tags run has them.
    - name: Load vault/<host>.yml if present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vault/{{ inventory_hostname }}.yml"
      when: (playbook_dir ~ '/vault/' ~ inventory_hostname ~ '.yml') is file
      no_log: true
      tags: [always]

    - name: Read ~/.config/SUSE/creds and the AWS credentials file on the host
      # The creds file is sourced, so it can use plain shell syntax.
      # Route53 keys: AWS_* in the creds file, else the AWS shared credentials file
      # ($AWS_SHARED_CREDENTIALS_FILE, ~/.config/aws/creds or ~/.aws/credentials;
      # profile $AWS_PROFILE or default).
      ansible.builtin.shell: |
        f="$HOME/.config/SUSE/creds"
        set -a
        [ -r "$f" ] && . "$f" >/dev/null 2>&1
        set +a
        python3 - <<'PY'
        import configparser, json, os
        keys = ["REGCODE", "REGEMAIL", "REGCODE_AI", "APPCO_USERNAME", "APPCO_TOKEN",
                "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY"]
        creds = {k: os.environ[k] for k in keys if os.environ.get(k)}
        if "AWS_ACCESS_KEY_ID" not in creds:
            home = os.path.expanduser("~")
            paths = [os.environ.get("AWS_SHARED_CREDENTIALS_FILE", ""),
                     f"{home}/.config/aws/creds", f"{home}/.aws/credentials"]
            path = next((p for p in paths if p and os.path.isfile(p)), None)
            if path:
                ini = configparser.ConfigParser()
                ini.read(path)
                sec = ini[os.environ.get("AWS_PROFILE", "default")] if ini.has_section(os.environ.get("AWS_PROFILE", "default")) else {}
                if sec.get("aws_access_key_id") and sec.get("aws_secret_access_key"):
                    creds["AWS_ACCESS_KEY_ID"] = sec["aws_access_key_id"]
                    creds["AWS_SECRET_ACCESS_KEY"] = sec["aws_secret_access_key"]
        print(json.dumps(creds))
        PY
      args:
        executable: /bin/bash
      become: false
      register: suse_creds_raw
      changed_when: false
      check_mode: false
      no_log: true
      tags: [always]

    - name: Parse creds
      ansible.builtin.set_fact:
        suse_creds: "{{ suse_creds_raw.stdout | from_json }}"
      no_log: true
      tags: [always]

  roles:
    - role: sudo
      tags: [sudo]
    - role: registration
      tags: [registration]
    - role: repos
      tags: [repos]
    - role: bootloader
      tags: [bootloader]
    - role: base
      tags: [base]
    - role: nvidia
      tags: [nvidia]
    - role: rke2
      tags: [rke2]
    - role: suse_ai
      tags: [suse_ai]
      when: suse_ai_enabled | bool
