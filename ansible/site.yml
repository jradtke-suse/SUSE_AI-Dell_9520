      tags: [bootloader]
    - role: base
      tags: [base]
    - role: nvidia
      tags: [nvidia]
    - role: rke2
      tags: [rke2]
    - role: suse_ai
      tags: [suse_ai]
      when: suse_ai_enabled | bool
