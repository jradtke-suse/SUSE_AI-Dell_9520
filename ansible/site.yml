---
- name: SUSE AI on a single SLES 16 + NVIDIA node
  hosts: suse_ai_nodes
  pre_tasks:
    - name: Load secrets (vault file or creds on the host)
      ansible.builtin.import_tasks: tasks/secrets.yml
      tags: [always]

  roles:
    - role: sudo
      tags: [sudo]
    - role: registration
      tags: [registration]
    - role: repos
      tags: [repos]
    - role: bootloader
      tags: [bootloader]
    - role: base
      tags: [base]
    - role: nvidia
      tags: [nvidia]
    - role: rke2
      tags: [rke2]
    - role: suse_ai
      tags: [suse_ai]
      when: suse_ai_enabled | bool
