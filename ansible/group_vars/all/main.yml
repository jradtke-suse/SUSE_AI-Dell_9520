---
# Shared settings. Per-host values live in host_vars/<host>.yml.

# ---- base ----
hostname: "{{ inventory_hostname }}"
domain: homelab.kubernerdes.com
# DNS (managed outside this repo):
#   wheatley.homelab.kubernerdes.com      -> 10.10.12.252
#   wheatley-wifi.homelab.kubernerdes.com -> 10.10.12.249 (WiFi)
#   jarvis.homelab.kubernerdes.com        -> 10.10.12.250
base_packages:
  - vim
  - curl
  - jq
  - htop
  - pciutils
  - mokutil
  - tmux
base_services:
  - sshd
  - chronyd
  - firewalld
firewall_ports: []          # rke2 role adds its own

# ---- nvidia ----
nvidia_install_gl: true     # nvidia-gl-G06: EGL/GBM for NVIDIA. Required for GNOME, or gnome-shell crashes in Mesa on the nvidia DRM device

# ---- rke2 ----
rke2_channel: stable        # or pin rke2_version
rke2_version: ""

# ---- suse_ai ----
open_webui_host: "{{ hostname }}.{{ domain }}"
suse_ai_enabled: true

# ---- secrets ----
# Each value comes from the first source that has it:
#   1. vault/<host>.yml (ansible-vault encrypted, loaded only if the file exists)
#   2. ~/.config/SUSE/creds on the target host (shell KEY=value, read by site.yml)
# Creds-file keys: REGCODE, REGEMAIL, REGCODE_AI, APPCO_USERNAME, APPCO_TOKEN,
#                  AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
_creds: "{{ suse_creds | default({}) }}"

# ---- registration (SCC direct) ----
# Only needed if the host isn't registered yet.
scc_regcode: "{{ vault_scc_regcode | default(_creds.REGCODE | default('')) }}"
scc_email: "{{ vault_scc_email | default(_creds.REGEMAIL | default('')) }}"
# Extensions/modules to activate, as identifier/version/arch.
# Run `sudo SUSEConnect --list-extensions` after registering to see what's available.
scc_extensions:
  - PackageHub/16.0/x86_64      # community packages (os-prober). Not SUSE-supported

# ---- repos ----
repos_remove_install_media: true   # drop the hd:/cd:/dvd:/iso: repo left by the installer
repos_extra: []                    # [{name: foo, url: https://...}]
repos_update_system: true          # zypper patch after repos are in place

# ---- SUSE Application Collection (SUSE AI components) ----
appco_registry: dp.apps.rancher.io
appco_username: "{{ vault_appco_username | default(_creds.APPCO_USERNAME | default('')) }}"
appco_token: "{{ vault_appco_token | default(_creds.APPCO_TOKEN | default('')) }}"
# SUSE Registry (registry.suse.com) login for SUSE AI: user `regcode`, SUSE AI regcode
suse_ai_regcode: "{{ vault_suse_ai_regcode | default(_creds.REGCODE_AI | default('')) }}"
# Route53 creds for Let's Encrypt DNS-01 (cert-manager on RKE2 nodes, Traefik on the LiteLLM VM).
# Empty = no Let's Encrypt: Open WebUI uses a self-signed CA, LiteLLM stays on plain HTTP :4000.
route53_access_key_id: "{{ vault_route53_access_key_id | default(_creds.AWS_ACCESS_KEY_ID | default('')) }}"
route53_secret_access_key: "{{ vault_route53_secret_access_key | default(_creds.AWS_SECRET_ACCESS_KEY | default('')) }}"
# Hosted zone for DNS-01 (cert-manager on RKE2 nodes, Traefik on the LiteLLM VM)
acme_dns_zone: kubernerdes.com
acme_route53_zone_id: Z03970223DJDS89C1XW4A
acme_route53_region: us-east-1

# ---- wifi (base role) ----
wifi_networks: []           # [{ssid: foo, psk: "{{ vault_foo_psk }}"}]
# Name WiFi sends to DHCP, so it never claims the host name (that's the wired address)
wifi_dhcp_hostname: "{{ hostname }}-wifi"

# ---- GNOME power (base role) ----
# Don't suspend when idle on AC power, for these users
gnome_no_sleep_on_ac_users: []
