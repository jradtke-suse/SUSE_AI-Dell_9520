---
# ---- base ----
hostname: wheatley        # after the Portal character
base_packages:
  - vim
  - curl
  - jq
  - htop
  - pciutils
  - mokutil
  - tmux
base_services:
  - sshd
  - chronyd
  - firewalld
firewall_ports: []          # rke2 role adds its own

# ---- nvidia ----
nvidia_install_gl: true     # nvidia-gl-G06: EGL/GBM for NVIDIA. Required for GNOME, or gnome-shell crashes in Mesa on the nvidia DRM device

# ---- rke2 ----
rke2_channel: stable        # or pin rke2_version
rke2_version: ""

# ---- suse_ai ----
suse_ai_enabled: true       # RKE2 + GPU driver verified 2026-10-30

# ---- registration (SCC direct) ----
# Secrets live in group_vars/all/vault.yml (ansible-vault encrypted).
# See group_vars/all/vault.yml.example
scc_regcode: "{{ vault_scc_regcode | default('') }}"
scc_email: "{{ vault_scc_email | default('') }}"
# Extensions/modules to activate, as identifier/version/arch.
# Run `sudo SUSEConnect --list-extensions` after registering to see what's available.
scc_extensions:
  - PackageHub/16.0/x86_64      # community packages (os-prober). Not SUSE-supported

# ---- repos ----
repos_remove_install_media: true   # drop the hd:/cd:/dvd:/iso: repo left by the installer
repos_extra: []                    # [{name: foo, url: https://...}]
repos_update_system: true          # zypper patch after repos are in place

# ---- SUSE Application Collection (SUSE AI components) ----
appco_registry: dp.apps.rancher.io
appco_username: "{{ vault_appco_username | default('') }}"
appco_token: "{{ vault_appco_token | default('') }}"
# SUSE Registry (registry.suse.com) login for SUSE AI: user `regcode`, SUSE AI regcode
suse_ai_regcode: "{{ vault_suse_ai_regcode | default('') }}"

# ---- wifi (base role) ----
wifi_networks:
  - ssid: KUBERNERDES
    psk: "{{ vault_wifi_kubernerdes_psk }}"

# ---- GNOME power (base role) ----
# Don't suspend when idle on AC power, for these users
gnome_no_sleep_on_ac_users:
  - mansible
