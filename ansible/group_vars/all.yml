---
# ---- base ----
hostname: xps9520
base_packages:
  - vim
  - curl
  - jq
  - htop
  - pciutils
  - mokutil
  - tmux
base_services:
  - sshd
  - chronyd
  - firewalld
firewall_ports: []          # rke2 role adds its own

# ---- nvidia ----
nvidia_driver_flavor: open  # "open" (SUSE recommended, Turing+) | "proprietary"

# ---- rke2 ----
rke2_channel: stable        # or pin rke2_version
rke2_version: ""
rke2_selinux: true

# ---- suse_ai ----
suse_ai_enabled: false      # flip on once RKE2 + GPU are verified
