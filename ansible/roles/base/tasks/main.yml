---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Install base packages
  community.general.zypper:
    name: "{{ base_packages }}"
    state: present

- name: Enable base services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ base_services }}"

- name: Open firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_ports }}"

- name: WiFi
  ansible.builtin.import_tasks: wifi.yml
  tags: [wifi]

- name: GNOME power settings
  ansible.builtin.import_tasks: gnome_power.yml
  tags: [gnome_power]
