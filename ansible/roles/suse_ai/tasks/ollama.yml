---
# Guide 4.7, standalone Ollama on the GPU
- name: Install Ollama from Application Collection
  kubernetes.core.helm:
    name: ollama
    chart_ref: "{{ appco_chart_base }}/ollama"
    chart_version: "{{ ollama_chart_version or omit }}"
    release_namespace: "{{ suse_ai_namespace }}"
    binary_path: "{{ suse_ai_helm }}"
    kubeconfig: "{{ suse_ai_kubeconfig }}"
    values:
      global:
        imagePullSecrets:
          - application-collection
      ingress:
        enabled: false
      ollama:
        models:
          pull: "{{ ollama_models_pull }}"
          run: "{{ ollama_models_run }}"
        gpu:
          enabled: true
          type: nvidia
          number: 1
          nvidiaResource: nvidia.com/gpu
      persistentVolume:
        enabled: true
        storageClass: local-path
        size: "{{ ollama_pv_size }}"
    wait: true
    wait_timeout: 20m   # first start pulls the models
