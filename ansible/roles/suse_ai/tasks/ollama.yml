---
# Guide 4.7, standalone Ollama on the GPU
- name: Let's Encrypt certificate for the Ollama ingress
  when: ollama_ingress_host | length > 0 and ollama_cert_issuer | length > 0
  block:
    - name: Request certificate
      ansible.builtin.command:
        argv: ["{{ suse_ai_kubectl }}", apply, -f, "-"]
        stdin: "{{ lookup('template', 'ollama-certificate.yaml.j2') }}"
      environment:
        KUBECONFIG: "{{ suse_ai_kubeconfig }}"
      register: ollama_cert
      changed_when: "'configured' in ollama_cert.stdout or 'created' in ollama_cert.stdout"

    - name: Wait for certificate (DNS-01 takes a minute or two)
      ansible.builtin.command: >-
        {{ suse_ai_kubectl }} wait -n {{ suse_ai_namespace }} certificate/ollama-le
        --for=condition=Ready --timeout=30s
      environment:
        KUBECONFIG: "{{ suse_ai_kubeconfig }}"
      register: ollama_cert_wait
      until: ollama_cert_wait.rc == 0
      retries: 20
      delay: 15
      changed_when: false
      when: not ansible_check_mode

- name: Install Ollama from Application Collection
  kubernetes.core.helm:
    name: ollama
    chart_ref: "{{ appco_chart_base }}/ollama"
    chart_version: "{{ ollama_chart_version or omit }}"
    release_namespace: "{{ suse_ai_namespace }}"
    binary_path: "{{ suse_ai_helm }}"
    kubeconfig: "{{ suse_ai_kubeconfig }}"
    values:
      global:
        imagePullSecrets:
          - application-collection
      ingress:
        enabled: "{{ ollama_ingress_host | length > 0 }}"
        className: traefik
        hosts:
          - host: "{{ ollama_ingress_host or 'ollama.local' }}"
            paths:
              - {path: /, pathType: Prefix}
        tls: "{{ [{'secretName': 'ollama-le-tls', 'hosts': [ollama_ingress_host]}] if (ollama_ingress_host | length > 0 and ollama_cert_issuer | length > 0) else [] }}"
      ollama:
        models:
          pull: "{{ ollama_models_pull }}"
          run: "{{ ollama_models_run }}"
        gpu:
          enabled: true
          type: nvidia
          number: 1
          nvidiaResource: nvidia.com/gpu
      persistentVolume:
        enabled: true
        storageClass: local-path
        size: "{{ ollama_pv_size }}"
    wait: true
    wait_timeout: 20m   # first start pulls the models
