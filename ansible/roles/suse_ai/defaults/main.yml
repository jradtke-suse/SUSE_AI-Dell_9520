---
# SUSE AI 1.0 guide, chapters 3-4, single node (see docs/05-suse-ai.md)

suse_ai_kubectl: /var/lib/rancher/rke2/bin/kubectl
suse_ai_kubeconfig: /etc/rancher/rke2/rke2.yaml
# RKE2 applies anything dropped here (and re-applies on change)
suse_ai_manifest_dir: /var/lib/rancher/rke2/server/manifests

# Helm major version from the SLES 16 product repo (guide: Helm 3; SLES 16 also ships 4.x)
suse_ai_helm_major: 3

# ---- storage: Rancher local-path-provisioner (single node, test-grade) ----
# Not in the guide; the guide's examples assume a `local-path` storage class.
# /opt/local-path-provisioner is already labeled container_file_t by container-selinux.
local_path_version: v0.0.37
local_path_image: registry.rancher.com/rancher/local-path-provisioner
local_path_helper_image: registry.rancher.com/rancher/mirrored-library-busybox:1.37.0
local_path_dir: /opt/local-path-provisioner
local_path_default: true

# ---- NVIDIA GPU Operator (guide 3.2) ----
# Guide pins v25.3.4 (mid-2025). RKE2 v1.36 / containerd 2.3 is newer than that,
# so use a current release. Values are the guide's.
gpu_operator_version: v26.7.2
gpu_operator_repo: https://helm.ngc.nvidia.com/nvidia
# Guide: add the toolkit dir to RKE2's PATH so RKE2 picks up nvidia-container-runtime
gpu_operator_toolkit_dir: /usr/local/nvidia/toolkit

# ---- Chapter 4: AI Library ----
suse_ai_namespace: suse-ai
cert_manager_namespace: cert-manager
suse_ai_helm: /usr/bin/helm
suse_registry: registry.suse.com
# Charts from SUSE Application Collection. Empty version = latest at install time.
appco_chart_base: oci://dp.apps.rancher.io/charts
cert_manager_chart_version: ""
# DNS-01 self-check must use public resolvers: the LAN DNS (10.10.12.10) answers
# homelab.kubernerdes.com itself and never sees the public _acme-challenge TXT.
cert_manager_dns01_nameservers: "1.1.1.1:53,8.8.8.8:53"

# ---- Let's Encrypt via Route53 DNS-01 ----
acme_dns_zone: kubernerdes.com
acme_route53_zone_id: Z03970223DJDS89C1XW4A
acme_route53_region: us-east-1
acme_servers:
  letsencrypt-staging: https://acme-staging-v02.api.letsencrypt.org/directory
  letsencrypt-prod: https://acme-v02.api.letsencrypt.org/directory

# ---- Ollama (guide 4.7) ----
ollama_chart_version: ""
# Small enough for a 4 GB GPU. Size these per host in host_vars.
ollama_models_pull:
  - "gemma:2b"
  - "llama3.2:3b"
ollama_models_run:          # preloaded into VRAM; only one fits at a time
  - "gemma:2b"
ollama_pv_size: 30Gi

# ---- Open WebUI (guide 4.8, standalone-Ollama variant) ----
open_webui_chart_version: ""
open_webui_host: "{{ ansible_fqdn }}"
open_webui_default_model: "gemma:2b"
# ClusterIssuer for the Open WebUI cert. "" = chart's self-signed suse-private-ai CA.
# Let's Encrypt only works with Route53 creds (the issuers aren't created otherwise).
open_webui_cert_issuer: "{{ 'letsencrypt-prod' if route53_access_key_id | length > 0 else '' }}"
