---
# Follows SUSE AI 1.0 guide section 2.2.1, adjusted for SLES 16 (see docs/sles16-deltas.md)

# SUSE-signed open driver meta-package, from the SLES 16 product repo
nvidia_driver_package: nv-prefer-signed-open-driver

# NVIDIA's sles16 repo has no driver userspace (yet), so use the sles15 repo
nvidia_repo_name: cuda-sle15
nvidia_repo_url: https://developer.download.nvidia.com/compute/cuda/repos/sles15/x86_64/

# Pinned to the installed driver version
nvidia_utils_packages:
  - nvidia-compute-utils-G06
  - nvidia-persistenced

# nvidia-gl-G06: only if something needs Vulkan
nvidia_install_gl: false

# zypper locks. NVIDIA's CUDA repo carries newer userspace (e.g. 580.196.07) than
# SUSE's signed KMP. Without locks, `zypper up` upgrades the userspace, then pulls
# NVIDIA's DKMS driver to match (unsigned, built locally) -> NVML version mismatch.
# The role unlocks, pins and re-locks these on each run.
nvidia_locked_packages:
  - nvidia-compute-utils-G06
  - nvidia-compute-G06
  - nvidia-common-G06
  - nvidia-gl-G06
  - nvidia-persistenced
  - nvidia-modprobe
  - libnvidia-ml
  - libnvidia-cfg
  - libnvidia-gpucomp
# Never install these (NVIDIA's DKMS driver path)
nvidia_blocked_packages:
  - nvidia-open-driver-G06
  - dkms
