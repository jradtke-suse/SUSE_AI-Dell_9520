---
- name: restart litellm
  ansible.builtin.systemd_service:
    name: litellm
    state: restarted
    daemon_reload: true
  when: litellm_was_active.stdout == 'active'

- name: restart litellm-proxy
  ansible.builtin.systemd_service:
    name: litellm-proxy
    state: restarted
    daemon_reload: true
