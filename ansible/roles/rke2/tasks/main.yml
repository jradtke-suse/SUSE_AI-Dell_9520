---
# TODO: flesh out. Skeleton for a single-node RKE2 server.
- name: Install rke2-selinux
  community.general.zypper:
    name: rke2-selinux
    state: present
  when: rke2_selinux | bool

- name: Install RKE2 server
  ansible.builtin.shell: |
    curl -sfL https://get.rke2.io | \
      INSTALL_RKE2_CHANNEL={{ rke2_channel }} {% if rke2_version %}INSTALL_RKE2_VERSION={{ rke2_version }}{% endif %} sh -
  args:
    creates: /usr/local/bin/rke2

- name: Open RKE2 firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ rke2_firewall_ports }}"

- name: Enable and start rke2-server
  ansible.builtin.systemd_service:
    name: rke2-server
    enabled: true
    state: started
